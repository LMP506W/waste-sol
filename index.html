<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SOLWASTE | THE PURGE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Plus+Jakarta+Sans:wght@300;800&family=Space+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #bc13fe; --bg: #020005; --card: rgba(12, 4, 22, 0.95); --border: rgba(188, 19, 254, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* PURPLE SCROLLBAR */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
        html, body { 
            background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow: hidden; height: 100vh; width: 100vw; overscroll-behavior: none;
        }

        #canvas-container { position: fixed; inset: 0; z-index: 1; }
        .noise { position: fixed; inset: 0; background: url('https://grainy-gradients.vercel.app/noise.svg'); opacity: 0.05; pointer-events: none; z-index: 5000; }
        
        /* NAV & HAMBURGER */
        nav { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 1100px; height: 70px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 25px; z-index: 3000; opacity: 0;
        }

        .menu-btn { width: 30px; height: 20px; cursor: pointer; position: relative; z-index: 4000; }
        .menu-btn span { 
            display: block; position: absolute; height: 2px; width: 100%; 
            background: #fff; border-radius: 9px; opacity: 1; left: 0; 
            transition: .25s ease-in-out; 
        }
        .menu-btn span:nth-child(1) { top: 0px; }
        .menu-btn span:nth-child(2) { top: 9px; }
        .menu-btn span:nth-child(3) { top: 18px; }
        .menu-btn.open span:nth-child(1) { top: 9px; transform: rotate(135deg); }
        .menu-btn.open span:nth-child(2) { opacity: 0; left: -60px; }
        .menu-btn.open span:nth-child(3) { top: 9px; transform: rotate(-135deg); }

        /* MOBILE PANEL */
        .side-panel {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 350px; height: 100vh;
            background: rgba(4, 1, 8, 0.98); border-left: 1px solid var(--border);
            backdrop-filter: blur(40px); z-index: 2500; padding: 120px 40px;
            transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .side-panel.open { right: 0; }

        /* VIEWPORT */
        .viewport { position: relative; z-index: 10; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; }
        .tab-content { display: none; width: 100%; max-width: 1000px; grid-template-columns: 1fr 1fr; gap: 25px; }
        .tab-content.active { display: grid; }

        .glass-card { 
            background: var(--card); border: 1px solid var(--border); border-radius: 30px; padding: 35px;
            display: flex; flex-direction: column; justify-content: space-between; min-height: 400px;
            backdrop-filter: blur(25px);
        }

        .btn {
            width: 100%; padding: 20px; background: #fff; color: #000; border: none; border-radius: 15px;
            font-family: 'Syncopate'; font-weight: 800; cursor: pointer; font-size: 10px; transition: 0.3s;
        }
        .btn:hover { background: var(--accent); color: #fff; box-shadow: 0 0 30px var(--accent); }

        input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            color: var(--accent); padding: 20px; border-radius: 15px; margin: 20px 0;
            font-family: 'Space Mono'; font-size: 28px; text-align: center;
        }

        #ledger { height: 240px; overflow-y: auto; font-family: 'Space Mono'; font-size: 10px; }
        .tx-row { padding: 10px 0; border-bottom: 1px solid rgba(188,19,254,0.1); display: flex; justify-content: space-between; }

        @media (max-width: 800px) {
            .tab-content.active { grid-template-columns: 1fr; margin-top: 80px; overflow-y: auto; max-height: 80vh; padding-bottom: 40px; }
            .side-panel { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="noise"></div>
<div id="canvas-container"></div>

<div id="intro" style="position:fixed; inset:0; background:#020005; z-index:10000; display:flex; justify-content:center; align-items:center;">
    <div style="font-family:'Syncopate'; color:#bc13fe; letter-spacing:8px; font-size:14px; text-align:center;">(THE PURGE)</div>
</div>

<nav id="main-nav">
    <div style="display: flex; align-items: center; gap: 12px;">
        <img src="https://i.ibb.co/Y4J2q82N/nothing-removebg-preview.png" style="width: 32px; filter: drop-shadow(0 0 8px var(--accent));">
        <span style="font-family: 'Syncopate'; font-size: 10px; letter-spacing: 3px;">SOLWASTE</span>
    </div>
    <div class="menu-btn" id="menuBtn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>
</nav>

<div id="sidePanel" class="side-panel">
    <div onclick="switchTab('main')" style="font-family:'Syncopate'; margin-bottom:30px; cursor:pointer; font-size:12px;">PURGE_STATION</div>
    <div onclick="switchTab('net')" style="font-family:'Syncopate'; margin-bottom:50px; cursor:pointer; font-size:12px;">NETWORK_CORE</div>
    <button id="connectBtn" class="btn" onclick="handleConnect()">CONNECT PHANTOM</button>
</div>

<div class="viewport" id="v-port">
    <div id="main" class="tab-content active">
        <div class="glass-card g-card">
            <div>
                <div style="font-family:'Syncopate'; font-size:8px; color:var(--accent);">VAULT_RESERVE</div>
                <div id="sol-bal" style="font-size: 40px; font-weight: 800; margin: 10px 0;">1.142 SOL</div>
            </div>
            <div>
                <input type="number" id="amt" value="0.1" step="0.1" min="0.001">
                <button id="purgeBtn" class="btn" onclick="executePurge()">INITIATE PURGE</button>
            </div>
        </div>
        <div class="glass-card g-card">
            <div style="font-family:'Syncopate'; font-size:8px; color:var(--accent);">PURGE_FEED</div>
            <div id="ledger"></div>
        </div>
    </div>
    
    <div id="net" class="tab-content">
        <div class="glass-card" style="grid-column: span 2; align-items:center; justify-content:center; text-align:center;">
            <div id="temp" style="font-size: 70px; font-family:'Syncopate'; text-shadow: 0 0 20px var(--accent);">38.4°C</div>
            <div style="font-family:'Space Mono'; font-size:10px; opacity:0.2; margin-top:20px;">BUILD_V70_FINAL</div>
        </div>
    </div>
</div>

<script>
    const TARGET = "7MSqi82KXWjEGvRP4LPNJLuGVWwhs7Vcoabq85tm8G3a";
    const RPC = "https://solana-mainnet.g.alchemy.com/v2/IRjl3800L8VqEF-VKysIs";
    const connection = new solanaWeb3.Connection(RPC, 'confirmed');

    function toggleMenu() {
        document.getElementById('menuBtn').classList.toggle('open');
        document.getElementById('sidePanel').classList.toggle('open');
    }

    function switchTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.getElementById(id).style.display = 'grid';
        toggleMenu();
    }

    // --- THREE.JS (Stars & Core) ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const starGeo = new THREE.BufferGeometry();
    const starCoords = [];
    for(let i=0; i<1000; i++) starCoords.push((Math.random()-0.5)*1500, (Math.random()-0.5)*1500, (Math.random()-0.5)*1500);
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.8}));
    scene.add(stars);

    const core = new THREE.Mesh(new THREE.IcosahedronGeometry(12, 1), new THREE.MeshStandardMaterial({ color: 0xbc13fe, wireframe: true, transparent:true, opacity:0.1 }));
    scene.add(core, new THREE.AmbientLight(0x404040), new THREE.PointLight(0xbc13fe, 2, 100));
    camera.position.z = 40;

    function animate() { requestAnimationFrame(animate); core.rotation.y += 0.002; stars.rotation.y += 0.0003; renderer.render(scene, camera); }
    animate();

    gsap.to(".g-card", { y: -12, duration: 3, repeat: -1, yoyo: true, ease: "sine.inOut", stagger: 0.3 });

    // --- LOGIC ---
    async function sync() {
        try {
            const pub = new solanaWeb3.PublicKey(TARGET);
            const bal = await connection.getBalance(pub);
            document.getElementById('sol-bal').innerText = (bal/1e9).toFixed(3) + " SOL";
            const sigs = await connection.getSignaturesForAddress(pub, {limit: 10});
            document.getElementById('ledger').innerHTML = sigs.map(s => `
                <div class="tx-row">
                    <span style="color:var(--accent); font-family:'Space Mono';">${s.signature.slice(0,10)}...</span>
                    <span style="color:var(--accent)">●</span>
                </div>
            `).join('');
        } catch(e) {}
    }

    async function handleConnect() {
        try {
            const resp = await window.solana.connect();
            document.getElementById('connectBtn').innerText = "LINKED";
            sync();
        } catch(e) { alert("Phantom Error"); }
    }

    async function executePurge() {
        const amtInput = document.getElementById('amt');
        let amt = parseFloat(amtInput.value);
        
        // Anti-Minus Check
        if(amt <= 0 || isNaN(amt)) {
            alert("Minimum 0.001 SOL required");
            amtInput.value = 0.1;
            return;
        }

        if(!window.solana?.isConnected) return alert("Connect Wallet!");

        try {
            document.getElementById('purgeBtn').innerText = "SENDING...";
            const tx = new solanaWeb3.Transaction().add(
                solanaWeb3.SystemProgram.transfer({
                    fromPubkey: window.solana.publicKey,
                    toPubkey: new solanaWeb3.PublicKey(TARGET),
                    lamports: Math.floor(amt * solanaWeb3.LAMPORTS_PER_SOL)
                })
            );
            tx.feePayer = window.solana.publicKey;
            tx.recentBlockhash = (await connection.getLatestBlockhash()).blockhash;
            const signed = await window.solana.signTransaction(tx);
            await connection.sendRawTransaction(signed.serialize(), { skipPreflight: true });
            
            document.getElementById('purgeBtn').innerText = "PURGED";
            setTimeout(() => { document.getElementById('purgeBtn').innerText = "INITIATE PURGE"; sync(); }, 3000);
        } catch(e) { alert("Transaction Denied"); document.getElementById('purgeBtn').innerText = "INITIATE PURGE"; }
    }

    window.onload = () => {
        setTimeout(() => {
            gsap.to("#intro", { opacity: 0, duration: 1, onComplete: () => {
                document.getElementById('intro').style.display = 'none';
                gsap.to(["nav", "#v-port"], { opacity: 1, duration: 1 });
            }});
        }, 2000);
        sync();
        setInterval(sync, 15000);
    };

    // Auto-fix negatives on input
    document.getElementById('amt').addEventListener('change', function() {
        if(this.value < 0.001) this.value = 0.001;
    });
</script>
</body>
</html>
